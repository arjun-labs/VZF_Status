<!DOCTYPE html>
<html lang="hi" data-lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VZF Project Status · Visual Zone Films</title>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
/* Layout idea: brand bar, then one card per project showing the six stages as a vertical track with a status chip each. Staff get the same cards with status buttons. */
:root{--ink:#04150a;--ink-2:#082613;--ink-3:#0d3319;--line:#1b4a2a;--paper:#f6f3e4;--muted:#9fb8a6;--gold:#f5c427;--neon:#39ff14;--warn:#ff9f43;--bad:#ff7a7a;
--body:'Hind','Noto Sans Devanagari',system-ui,sans-serif;--latin:'Bebas Neue',Impact,sans-serif;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-size:17px;line-height:1.55}
body:before{content:"";position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#006010,#39ff14 50%,#f5c427);z-index:9}
.wrap{max-width:860px;margin:0 auto;padding:0 18px}
.bar{border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:14px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:52px;width:auto;filter:drop-shadow(0 0 10px rgba(57,255,20,.35))}
.brand b{display:block;color:var(--gold);font-family:var(--latin);letter-spacing:.14em;font-weight:400;font-size:21px;line-height:1}
.brand i{display:block;font-style:normal;font-size:13px;color:var(--neon)}
.lang{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{background:none;border:0;color:var(--muted);font:600 14px var(--body);padding:5px 14px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--gold);color:var(--ink)}
h1{font-size:clamp(24px,5vw,34px);font-weight:600;margin:26px 0 4px;line-height:1.25}
.sub{color:var(--muted);margin-bottom:20px}
.msg{border:1px dashed var(--line);border-radius:8px;padding:14px 16px;color:var(--muted);margin:16px 0}
.badge{display:inline-block;font:600 12px var(--body);letter-spacing:.06em;border:1px solid var(--gold);color:var(--gold);border-radius:99px;padding:1px 10px;margin-left:8px;vertical-align:middle}
.proj{background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:18px;margin:0 0 18px}
.proj h2{font-size:20px;font-weight:600}
.proj .cl{color:var(--muted);font-size:14px;margin-bottom:12px}
.stg{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.stg .n{font-family:var(--latin);font-size:20px;color:var(--gold)}
.chip{font:600 13px var(--body);border-radius:99px;padding:2px 12px;border:1px solid currentColor;white-space:nowrap}
.c-process{color:var(--gold)}.c-done{color:var(--neon)}.c-pause{color:var(--warn)}.c-cancel{color:var(--bad)}.c-none{color:var(--muted)}
.stg.cur{background:rgba(245,196,39,.07);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:6px}
.note{margin-top:12px;padding:10px 12px;border-left:3px solid var(--gold);background:var(--ink-3);border-radius:0 6px 6px 0;font-size:15px}
.upd{color:var(--muted);font-size:12.5px;margin-top:10px}
.ctl{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;padding-bottom:4px}
.ctl button,.btn{font:600 13px var(--body);background:none;border:1px solid var(--line);color:var(--paper);border-radius:6px;padding:5px 10px;cursor:pointer}
.ctl button[aria-pressed=true]{background:currentColor}
.ctl button[aria-pressed=true] span{color:var(--ink)}
.btn.pri{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.staff{border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 22px;background:var(--ink-2)}
.staff h3{font-size:16px;margin-bottom:8px;color:var(--gold)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
input,select,textarea{background:var(--ink);border:1px solid var(--line);color:var(--paper);border-radius:6px;padding:7px 10px;font:inherit;font-size:15px;min-width:0;flex:1 1 180px}
textarea{width:100%;flex-basis:100%;min-height:44px;margin-top:10px}
footer{color:var(--muted);font-size:13px;padding:24px 0 40px;border-top:1px solid var(--line);margin-top:30px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.login{max-width:380px;margin:30px auto}.login input{width:100%;margin-bottom:10px;flex:none}.err{color:var(--bad);font-size:14px;min-height:20px}.mini{font-size:13px;color:var(--muted)}</style>
</head>

  <div style="display:flex;gap:8px;align-items:center"><button class="btn" id="lo" style="display:none"></button><div class="lang" role="group" aria-label="Language"><button id="lh" aria-pressed="true">हिं</button><button id="le" aria-pressed="false">EN</button></div></div>

<main class="wrap">
  <h1 id="h1"></h1><p class="sub" id="sub"></p>
  <div id="app"></div>
  <footer id="foot"></footer>
</main>
<script>
(function(){
var lang='hi';
function L(h,e){return lang==='en'?e:h}
var STAGES=[['ब्रीफ़','Brief'],['प्लान','Plan'],['शूट','Shoot'],['एडिट और AI','Edit & AI'],['म्यूज़िक','Music'],['रिव्यू और डिलीवरी','Review & Delivery']];
var ST={process:['चल रहा है','In process'],done:['पूरा हुआ','Done'],pause:['रुका हुआ','Paused'],cancel:['रद्द','Cancelled']};
var ORDER=['process','done','pause','cancel'];
var S={me:null,clients:[],projects:[],requests:[],users:[],sent:false,openOld:false,err:''};
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function ago(ts){if(!ts)return'';var m=Math.round((Date.now()-ts)/60000);if(m<1)return L('अभी','just now');if(m<60)return m+L(' मिनट पहले',' min ago');var h=Math.round(m/60);if(h<24)return h+L(' घंटे पहले',' h ago');return Math.round(h/24)+L(' दिन पहले',' d ago')}
function api(m,u,b){return fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined,credentials:'same-origin'}).then(function(r){if(r.status===401&&u!=='/api/login'){S.me=null;render();throw new Error('login')}return r.json().then(function(j){if(!r.ok)throw j;return j})})}
function staff(){return S.me&&(S.me.role==='owner'||S.me.role==='lead')}
function owner(){return S.me&&S.me.role==='owner'}
function chip(st){var k=st||'none';var lab=k==='none'?L('आगे आएगा','Upcoming'):L(ST[k][0],ST[k][1]);return '<span class="chip c-'+k+'">'+esc(lab)+'</span>'}
function finished(p){var v=p.stages.s5;return v==='done'||v==='cancel'}
function cur(p){for(var i=0;i<6;i++){var v=p.stages['s'+i];if(v==='process'||v==='pause')return i}return -1}
function cname(id){var c=S.clients.filter(function(x){return x.id===id})[0];return c?c.name:''}

function projCard(p){
  var c=cur(p),h='<div class="proj"><h2>'+esc(p.title)+'</h2><div class="cl">'+esc(cname(p.clientId))+'</div>';
  for(var i=0;i<6;i++){var v=p.stages['s'+i];
    h+='<div class="stg'+(i===c?' cur':'')+'"><span class="n">'+(i+1)+'</span><span>'+esc(L(STAGES[i][0],STAGES[i][1]))+'</span>'+chip(v);
    if(staff()){h+='<div class="ctl" data-p="'+p.id+'" data-s="'+i+'">'+ORDER.map(function(k){return '<button data-k="'+k+'" class="c-'+k+'" aria-pressed="'+(v===k)+'"><span>'+esc(L(ST[k][0],ST[k][1]))+'</span></button>'}).join('')+'<button data-k="" class="c-none" aria-pressed="false"><span>'+L('साफ़','Clear')+'</span></button></div>'}
    h+='</div>'}
  if(staff())h+='<textarea data-note="'+p.id+'" placeholder="'+L('क्लाइंट के लिए छोटा नोट','Short note for the client')+'">'+esc(p.note)+'</textarea>';
  else if(p.note)h+='<div class="note">'+esc(p.note)+'</div>';
  h+='<div class="upd">'+L('आख़िरी अपडेट: ','Last update: ')+ago(p.updatedAt)+(staff()&&p.updatedBy?' · '+esc(p.updatedBy):'')+'</div>';
  if(owner())h+='<div class="row" style="margin-top:8px"><button class="btn" data-del="'+p.id+'">'+L('प्रोजेक्ट हटाएँ','Delete project')+'</button></div>';
  return h+'</div>'}

function staffPanel(){
  var opts=S.clients.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join('');
  var h='<div class="staff"><h3>'+L('नया प्रोजेक्ट','New project')+'</h3><div class="row"><select id="np-c">'+(opts||'<option value="">'+L('पहले क्लाइंट जोड़ें','Add a client first')+'</option>')+'</select><input id="np-t" placeholder="'+L('प्रोजेक्ट का नाम','Project name')+'"><button class="btn pri" id="np-go">'+L('जोड़ें','Add')+'</button></div></div>';
  if(S.requests.length)h+='<div class="staff"><h3>'+L('क्लाइंट की नई रिक्वेस्ट','New client requests')+'</h3>'+S.requests.map(function(r){return '<div class="row" style="align-items:center"><span style="flex:1 1 220px"><b>'+esc(r.title)+'</b> <span class="upd">'+esc(cname(r.clientId))+(r.details?' · '+esc(r.details):'')+'</span></span><button class="btn pri" data-mk="'+r.id+'">'+L('प्रोजेक्ट बनाएँ','Create project')+'</button><button class="btn" data-rx="'+r.id+'">'+L('हटाएँ','Dismiss')+'</button></div>'}).join('')+'</div>';
  if(owner()){
    var copts=S.clients.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join('');
    h+='<div class="staff"><h3>'+L('नया क्लाइंट','New client')+'</h3><div class="row"><input id="nc-n" placeholder="'+L('क्लाइंट / कंपनी का नाम','Client / company name')+'"><button class="btn pri" id="nc-go">'+L('जोड़ें','Add')+'</button></div></div>';
    h+='<div class="staff"><h3>'+L('नया लॉगिन बनाएँ','Create a login')+'</h3><div class="row"><input id="nu-n" placeholder="'+L('नाम','Name')+'"><input id="nu-e" type="email" placeholder="email"><input id="nu-p" placeholder="'+L('पासवर्ड (कम से कम 6)','Password (min 6)')+'"></div><div class="row"><select id="nu-r"><option value="client">'+L('क्लाइंट','Client')+'</option><option value="lead">'+L('टीम लीड','Team lead')+'</option></select><select id="nu-c">'+copts+'</select><button class="btn pri" id="nu-go">'+L('बनाएँ','Create')+'</button></div><div class="mini">'+L('वही ईमेल दोबारा डालने पर पासवर्ड बदल जाता है। क्लाइंट को ईमेल और पासवर्ड WhatsApp से भेजें।','Entering the same email again resets the password. Send the client their email and password on WhatsApp.')+'</div>'+
      S.users.map(function(u){return '<div class="row" style="margin-top:8px;align-items:center"><span style="flex:1 1 220px">'+esc(u.name)+' <span class="upd">'+esc(u.email)+' · '+esc(u.role)+(u.clientId?' · '+esc(cname(u.clientId)):'')+'</span></span>'+(u.role!=='owner'?'<button class="btn" data-du="'+u.id+'">'+L('हटाएँ','Remove')+'</button>':'')+'</div>'}).join('')+'</div>'}
  return h}

function reqBox(){
  if(S.sent)return '<div class="staff"><h3>'+L('नया प्रोजेक्ट','New project')+'</h3><div class="msg" style="margin:0">'+L('रिक्वेस्ट भेज दी गई है। VZF टीम जल्द ही इसे जोड़ देगी।','Request sent. The VZF team will add it shortly.')+'</div></div>';
  return '<div class="staff"><h3>'+L('नया प्रोजेक्ट माँगें','Request a new project')+'</h3><div class="row"><input id="rq-t" placeholder="'+L('क्या बनवाना है? (जैसे: दिवाली रील्स)','What do you need? (e.g. Diwali reels)')+'"><button class="btn pri" id="rq-go">'+L('भेजें','Send')+'</button></div><div class="row"><input id="rq-d" placeholder="'+L('कुछ और बताना हो तो (वैकल्पिक)','Anything else (optional)')+'"></div></div>'}

function loginView(){
  return '<div class="login"><h1 style="margin-top:10px">'+L('लॉगिन','Login')+'</h1><p class="sub">'+L('VZF ने जो ईमेल और पासवर्ड भेजा है, वही डालें।','Use the email and password VZF sent you.')+'</p><input id="li-e" type="email" placeholder="email" autocomplete="username"><input id="li-p" type="password" placeholder="'+L('पासवर्ड','Password')+'" autocomplete="current-password"><div class="err" id="li-err">'+esc(S.err)+'</div><button class="btn pri" id="li-go" style="width:100%;padding:10px">'+L('अंदर जाएँ','Enter')+'</button></div>'}

function render(){
  var app=document.getElementById('app'),lo=document.getElementById('lo');
  document.getElementById('foot').textContent=L('Visual Zone Films · वाराणसी · +91 88508 65540','Visual Zone Films · Varanasi · +91 88508 65540');
  if(!S.me){document.getElementById('h1').textContent='';document.getElementById('sub').textContent='';lo.style.display='none';app.innerHTML=loginView();bindLogin();return}
  lo.style.display='';lo.textContent=L('बाहर निकलें','Log out');
  document.getElementById('h1').innerHTML=staff()?L('सभी प्रोजेक्ट्स <span class="badge">TEAM</span>','All projects <span class="badge">TEAM</span>'):L('आपके प्रोजेक्ट की स्थिति','Your project status');
  document.getElementById('sub').textContent=staff()?L('हर स्टेप का स्टेटस यहीं बदलें।','Change each step\'s status here.'):L('काम अभी किस स्टेप पर है, यहाँ देखें।','See which step your work is at right now.');
  if(document.activeElement&&/TEXTAREA|INPUT|SELECT/.test(document.activeElement.tagName)&&app.contains(document.activeElement))return;
  var act=S.projects.filter(function(p){return !finished(p)}),old=S.projects.filter(finished);
  var h=staff()?staffPanel():reqBox();
  if(!S.projects.length)h+='<div class="msg">'+(staff()?L('अभी कोई प्रोजेक्ट नहीं है।','No projects yet.'):L('अभी कोई प्रोजेक्ट नहीं है। VZF जल्द ही जोड़ेगी।','No projects yet. VZF will add one soon.'))+'</div>';
  if(act.length&&!staff())h+='<h2 style="font-size:18px;margin:6px 0 10px;color:var(--gold)">'+L('चल रहे प्रोजेक्ट','Running projects')+'</h2>';
  h+=act.map(projCard).join('');
  if(old.length)h+='<details style="margin-top:8px"'+(S.openOld?' open':'')+'><summary style="cursor:pointer;color:var(--gold);font-weight:600;margin-bottom:12px">'+L('पुराने प्रोजेक्ट (','Past projects (')+old.length+')</summary>'+old.map(projCard).join('')+'</details>';
  app.innerHTML=h;bind()}

function bindLogin(){
  var go=function(){S.err='';api('POST','/api/login',{email:document.getElementById('li-e').value,password:document.getElementById('li-p').value}).then(load).catch(function(e){S.err=e&&e.error==='many'?L('बहुत कोशिशें हुईं, थोड़ी देर बाद करें।','Too many tries, wait a bit.'):L('ईमेल या पासवर्ड गलत है।','Wrong email or password.');document.getElementById('li-err').textContent=S.err})};
  document.getElementById('li-go').onclick=go;document.getElementById('li-p').onkeydown=function(e){if(e.key==='Enter')go()}}
function after(p){return p.then(load).catch(function(e){if(e&&e.message==='login')return;alert(L('नहीं हो पाया।','Did not work.'))})}
function bind(){
  var q=function(s){return document.querySelectorAll(s)};
  q('.ctl button').forEach(function(b){b.onclick=function(){var c=b.parentNode;after(api('PUT','/api/projects/'+c.dataset.p,{stage:Number(c.dataset.s),status:b.dataset.k}))}});
  q('textarea[data-note]').forEach(function(t){t.onblur=function(){var id=Number(t.dataset.note),p=S.projects.filter(function(x){return x.id===id})[0];if(p&&p.note!==t.value)after(api('PUT','/api/projects/'+id,{note:t.value}))}});
  var on=function(id,f){var e=document.getElementById(id);if(e)e.onclick=f};
  on('np-go',function(){var c=Number(document.getElementById('np-c').value),t=document.getElementById('np-t').value.trim();if(c&&t)after(api('POST','/api/projects',{clientId:c,title:t}))});
  on('nc-go',function(){var n=document.getElementById('nc-n').value.trim();if(n)after(api('POST','/api/clients',{name:n}))});
  on('nu-go',function(){var r=document.getElementById('nu-r').value;after(api('POST','/api/users',{name:document.getElementById('nu-n').value,email:document.getElementById('nu-e').value,password:document.getElementById('nu-p').value,role:r,clientId:Number(document.getElementById('nu-c').value)||null}))});
  on('rq-go',function(){var t=document.getElementById('rq-t').value.trim();if(t)api('POST','/api/requests',{title:t,details:document.getElementById('rq-d').value}).then(function(){S.sent=true;render()}).catch(function(){alert(L('भेज नहीं पाए। कृपया VZF को WhatsApp करें।','Could not send. Please WhatsApp VZF.'))})});
  q('[data-mk]').forEach(function(b){b.onclick=function(){var r=S.requests.filter(function(x){return x.id===Number(b.dataset.mk)})[0];after(api('POST','/api/projects',{clientId:r.clientId,title:r.title,note:r.details,requestId:r.id}))}});
  q('[data-rx]').forEach(function(b){b.onclick=function(){after(api('DELETE','/api/requests/'+b.dataset.rx))}});
  q('[data-del]').forEach(function(b){b.onclick=function(){if(confirm(L('यह प्रोजेक्ट हटाएँ?','Delete this project?')))after(api('DELETE','/api/projects/'+b.dataset.del))}});
  q('[data-du]').forEach(function(b){b.onclick=function(){if(confirm(L('यह लॉगिन हटाएँ?','Remove this login?')))after(api('DELETE','/api/users/'+b.dataset.du))}});
  q('details').forEach(function(d){d.ontoggle=function(){S.openOld=d.open}})}

function load(){return api('GET','/api/me').then(function(j){S.me=j.user;S.clients=j.clients||[];S.projects=j.projects||[];S.requests=j.requests||[];S.users=j.users||[];render()}).catch(function(){})}
function setLang(l){lang=l;document.documentElement.lang=l;document.getElementById('lh').setAttribute('aria-pressed',String(l==='hi'));document.getElementById('le').setAttribute('aria-pressed',String(l==='en'));render()}
document.getElementById('lh').onclick=function(){setLang('hi')};
document.getElementById('le').onclick=function(){setLang('en')};
document.getElementById('lo').onclick=function(){api('POST','/api/logout').then(function(){S.me=null;render()})};
render();load();
setInterval(function(){if(S.me&&!document.hidden)load()},20000);
})();
</script>
</body>
</html>
